<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📘 Personal Assistant & PDF Reader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .h-100 {
            height: 100vh !important;
        }
        
        .chat-container {
            overflow-y: auto;
            background: #f8f9fa;
            max-height: calc(100vh - 140px);
        }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h4 {
            margin: 0;
            flex-grow: 1;
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }
        
        .message.user {
            text-align: right;
        }
        
        .message.assistant {
            text-align: left;
        }
        
        .message-bubble {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.user .message-bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }
        
        .message-time {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 4px;
        }
        
        .upload-area {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: #007bff !important;
            background-color: #f8f9fa;
        }
        
        .upload-area.dragover {
            border-color: #007bff !important;
            background-color: #e3f2fd;
        }
        
        .status-success {
            color: #28a745;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .status-error {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            max-width: 70%;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #6c757d;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Chat Section -->
            <div class="col-lg-8 col-md-7 d-flex flex-column">
                <div class="chat-header p-3 bg-primary text-white">
                    <h4><i class="fas fa-comments me-2"></i>Personal Chat</h4>
                    <button class="btn btn-outline-light btn-sm" onclick="clearChat()">
                        <i class="fas fa-trash me-1"></i>Clear Chat
                    </button>
                </div>
                
                <div class="chat-container flex-grow-1 p-3" id="chatContainer">
                    <div class="welcome-message text-center text-muted">
                        <i class="fas fa-robot fa-3x mb-3"></i>
                        <h5>Welcome! How can I help you today?</h5>
                        <p>You can chat with me about anything or upload a PDF to ask questions about it.</p>
                    </div>
                </div>
                
                <div class="chat-input p-3 border-top">
                    <div class="input-group">
                        <input type="text" class="form-control" id="messageInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
                        <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- PDF Upload Section -->
            <div class="col-lg-4 col-md-5 bg-light border-start">
                <div class="pdf-header p-3 bg-secondary text-white">
                    <h5><i class="fas fa-file-pdf me-2"></i>PDF Upload & Questions</h5>
                </div>
                
                <div class="p-3">
                    <div class="upload-area border-2 border-dashed border-secondary rounded p-4 text-center" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt fa-3x text-secondary mb-3"></i>
                        <h6>Upload a PDF to ask questions</h6>
                        <p class="text-muted small">Drag & drop or click to select</p>
                        <input type="file" class="form-control d-none" id="fileInput" accept=".pdf" onchange="uploadFile()">
                        <button class="btn btn-outline-secondary" onclick="document.getElementById('fileInput').click()">
                            <i class="fas fa-folder-open me-1"></i>Choose File
                        </button>
                    </div>
                    
                    <div class="upload-status mt-3" id="uploadStatus"></div>
                    
                    <!-- Uploaded File Display -->
                    <div class="uploaded-file d-none" id="uploadedFile">
                        <div class="alert alert-success d-flex align-items-center">
                            <i class="fas fa-file-pdf me-2"></i>
                            <div>
                                <strong>Uploaded:</strong>
                                <span id="fileName"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Loader -->
                    <div class="loader-container d-none" id="loaderContainer">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted">Processing PDF...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript for PDF Reader App
        let isProcessing = false;
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            setupDragAndDrop();
            focusMessageInput();
        });
        
        function setupDragAndDrop() {
            const uploadArea = document.getElementById('uploadArea');
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const fileInput = document.getElementById('fileInput');
                    fileInput.files = files;
                    uploadFile();
                }
            });
        }
        
        function focusMessageInput() {
            document.getElementById('messageInput').focus();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        async function sendMessage() {
            if (isProcessing) return;
            
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            messageInput.value = '';
            isProcessing = true;
            updateSendButton(true);
            
            addMessage('user', message);
            showTypingIndicator();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                hideTypingIndicator();
                
                if (data.success) {
                    addMessage('assistant', data.response);
                } else {
                    addMessage('assistant', 'Sorry, I encountered an error: ' + data.message);
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('assistant', 'Sorry, I encountered a connection error. Please try again.');
                console.error('Error:', error);
            } finally {
                isProcessing = false;
                updateSendButton(false);
                focusMessageInput();
            }
        }
        
        function addMessage(role, content) {
            const chatContainer = document.getElementById('chatContainer');
            const welcomeMessage = chatContainer.querySelector('.welcome-message');
            
            if (welcomeMessage) {
                welcomeMessage.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = content;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            messageDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(timeDiv);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showTypingIndicator() {
            const chatContainer = document.getElementById('chatContainer');
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';
            
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'typing-indicator';
            indicatorDiv.innerHTML = `
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            
            typingDiv.appendChild(indicatorDiv);
            chatContainer.appendChild(typingDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
        
        function updateSendButton(disabled) {
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');
            
            sendBtn.disabled = disabled;
            messageInput.disabled = disabled;
            
            if (disabled) {
                sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            } else {
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }
        }
        
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) return;
            
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                showUploadStatus('Please select a PDF file.', 'error');
                return;
            }
            
            showLoader(true);
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showUploadStatus(data.message, 'success');
                    showUploadedFile(data.filename);
                    addMessage('assistant', '✅ PDF processed successfully!');
                } else {
                    showUploadStatus(data.message, 'error');
                }
            } catch (error) {
                showUploadStatus('Upload failed. Please try again.', 'error');
                console.error('Upload error:', error);
            } finally {
                showLoader(false);
                fileInput.value = '';
            }
        }
        
        function showLoader(show) {
            const loaderContainer = document.getElementById('loaderContainer');
            if (show) {
                loaderContainer.classList.remove('d-none');
            } else {
                loaderContainer.classList.add('d-none');
            }
        }
        
        function showUploadStatus(message, type) {
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML = `<div class="status-${type}">${message}</div>`;
            
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }
        
        function showUploadedFile(filename) {
            const uploadedFileDiv = document.getElementById('uploadedFile');
            const fileNameSpan = document.getElementById('fileName');
            
            fileNameSpan.textContent = filename;
            uploadedFileDiv.classList.remove('d-none');
        }
        
        async function clearChat() {
            if (!confirm('Are you sure you want to clear the chat history?')) {
                return;
            }
            
            try {
                const response = await fetch('/clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = `
                        <div class="welcome-message text-center text-muted">
                            <i class="fas fa-robot fa-3x mb-3"></i>
                            <h5>Welcome! How can I help you today?</h5>
                            <p>You can chat with me about anything or upload a PDF to ask questions about it.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Clear chat error:', error);
            }
        }
    </script>
</body>
</html>
